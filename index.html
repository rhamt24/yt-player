<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Player</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0b0f;color:#e6ebf5;font-family:Arial,Helvetica,sans-serif}
  body{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:12px}
  .box{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
  .box.short{aspect-ratio:9/16;max-height:78vh;width:auto;margin:0 auto}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  a.btn{display:block;text-align:center;padding:12px;border-radius:99px;background:#fff;color:#111;font-weight:700;text-decoration:none}
  #err{text-align:center;color:#fb7185;display:none}
</style>
</head>
<body>
  <div class="box" id="box"></div>
  <p id="err">ID video tidak valid.</p>
  <a class="btn" id="open" href="#" style="display:none">Buka di YouTube</a>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var id = (q.get('v') || '').trim();
  var isShort = q.get('s') === '1';
  if (!/^[\w-]{11}$/.test(id)) { document.getElementById('err').style.display = 'block'; return; }

  var box = document.getElementById('box');
  if (isShort) box.className = 'box short';

  var src = 'https://www.youtube.com/embed/' + id +
            '?autoplay=1&playsinline=1&rel=0&modestbranding=1' +
            '&origin=' + encodeURIComponent(location.origin);

  var f = document.createElement('iframe');
  f.src = src;
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.allowFullscreen = true;
  box.appendChild(f);

  var a = document.getElementById('open');
  a.href = 'https://www.youtube.com/watch?v=' + id;
  a.style.display = 'block';
})();
</script>
</body>
</html>
