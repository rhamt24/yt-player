<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Player</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0b0f;color:#e6ebf5;font-family:Arial,Helvetica,sans-serif}
  body{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:12px}
  .box{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
  .box.short{aspect-ratio:9/16;max-height:72vh;width:auto;margin:0 auto}
  .box iframe,.box #player{position:absolute;inset:0;width:100%;height:100%;border:0}
  #status{text-align:center;font-size:13px;color:#8b8fd6;min-height:18px}
  #status.bad{color:#fb7185}
  a.btn{display:block;text-align:center;padding:12px;border-radius:99px;background:#fff;color:#111;font-weight:700;text-decoration:none}
</style>
</head>
<body>
  <div class="box" id="box"><div id="player"></div></div>
  <div id="status">Memuat player…</div>
  <a class="btn" id="open" href="#" style="display:none">Buka di YouTube</a>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var id = (q.get('v') || '').trim();
  var st = document.getElementById('status');
  var box = document.getElementById('box');

  function say(t, bad){ st.textContent = t; st.className = bad ? 'bad' : ''; }

  if (!/^[\w-]{11}$/.test(id)) { say('ID video tidak valid (pakai ?v=ID).', true); return; }
  if (q.get('s') === '1') box.className = 'box short';

  var open = document.getElementById('open');
  open.href = 'https://www.youtube.com/watch?v=' + id;
  open.style.display = 'block';

  var ready = false;

  var ERR = {
    2:'Parameter video tidak valid',
    5:'Error pemutar HTML5',
    100:'Video tidak ditemukan / privat',
    101:'Pemilik video melarang embed',
    150:'Pemilik video melarang embed',
    153:'Referer/origin tidak terkirim'
  };

  // Diagnostik: kalau API tidak termuat dalam 7 detik, webview kemungkinan memblokir YouTube
  var timer = setTimeout(function(){
    if (!ready) say('Player tidak termuat (webview memblokir YouTube?). Pakai tombol di bawah.', true);
  }, 7000);

  window.onYouTubeIframeAPIReady = function(){
    new YT.Player('player', {
      videoId: id,
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, origin: location.origin },
      events: {
        onReady: function(e){ ready = true; clearTimeout(timer); say('Siap. Ketuk video jika belum otomatis jalan.'); try { e.target.playVideo(); } catch(_){} },
        onStateChange: function(e){ if (e.data === 1) say('Memutar…'); },
        onError: function(e){ ready = true; clearTimeout(timer); say('Error ' + e.data + ': ' + (ERR[e.data] || 'tidak diketahui'), true); }
      }
    });
  };

  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = function(){ clearTimeout(timer); say('Script YouTube diblokir oleh webview.', true); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
